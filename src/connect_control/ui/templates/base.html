<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Connect Control{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; color: #1a1a1a; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.3rem 0.6rem; text-align: left; vertical-align: top; }
    code, pre { background: #f4f4f4; padding: 0.1rem 0.3rem; }
    pre { padding: 0.6rem; overflow-x: auto; }
    .ok { color: #0a7a0a; } .broken { color: #b00000; } .degraded { color: #8a6d00; }
    .banner { border: 1px solid #8a6d00; background: #fff8e1; padding: 0.6rem; margin: 1rem 0; }
    .timeline li { margin-bottom: 0.4rem; }
  </style>
</head>
<body>
<nav>
  <a href="/work-requests">Work Requests</a>
  <a href="/marketplace">Marketplace</a>
  <a href="/planes">Planes</a>
  <a href="/healthz">Health</a>
</nav>
<hr>
{% block content %}{% endblock %}
<hr>
<p><small>Connect Control — the thin control plane. Read-only surfaces except
Work Request creation, which is kernel-evaluated through Connect-Governance.</small></p>
</body>
</html>
